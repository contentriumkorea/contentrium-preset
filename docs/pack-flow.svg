<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260"><style>text{font-family:Arial,'Malgun Gothic',sans-serif}</style><rect width="1200" height="260" rx="20" fill="#101b2c"/><text x="50" y="52" fill="#8aa7cd" font-size="18">Contentrium Preset 사용 흐름</text><rect x="45" y="88" width="248" height="121" rx="12" fill="#20354f"/><text x="169" y="135" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">본체 설치</text><text x="169" y="173" fill="#c5d8ee" font-size="16" text-anchor="middle">Setup.exe 또는 오프라인 ZIP</text><text x="315" y="159" text-anchor="middle" fill="#5ec8b9" font-size="27">→</text><rect x="340" y="88" width="248" height="121" rx="12" fill="#1d504f"/><text x="464" y="135" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">팩 등록</text><text x="464" y="173" fill="#c5d8ee" font-size="16" text-anchor="middle">별도로 보유한 전용 ZIP</text><text x="610" y="159" text-anchor="middle" fill="#5ec8b9" font-size="27">→</text><rect x="635" y="88" width="248" height="121" rx="12" fill="#20354f"/><text x="759" y="135" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">AE 재시작</text><text x="759" y="173" fill="#c5d8ee" font-size="16" text-anchor="middle">등록한 라이브러리 연결</text><text x="905" y="159" text-anchor="middle" fill="#5ec8b9" font-size="27">→</text><rect x="930" y="88" width="248" height="121" rx="12" fill="#20354f"/><text x="1054" y="135" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">프리셋 사용</text><text x="1054" y="173" fill="#c5d8ee" font-size="16" text-anchor="middle">탐색 · 미리보기 · 적용</text></svg>